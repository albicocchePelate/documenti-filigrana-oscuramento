<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <title>Filigrana e oscuramento per documenti</title>
    <base href="./" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />

    <!--
      ================================================================
      QUESTA RIGA BLOCCA GLI INVII DI DATI DAL CODICE.
      connect-src 'none': il browser rifiuta fetch, XHR e WebSocket,
      anche delle librerie usate. Il resto lo dice il codice, che è pubblico.
      ================================================================
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self'; connect-src 'none'; form-action 'none'; base-uri 'self'; object-src 'none'"
    />

    <link rel="stylesheet" href="/kit/stile.css" />
    <script src="/kit/kit.js"></script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
