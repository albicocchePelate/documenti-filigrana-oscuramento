@if (compatta()) {
  <div
    class="riga"
    [class.sopra]="sopra()"
    (dragover)="trascina($event)"
    (dragleave)="sopra.set(false)"
    (drop)="lascia($event)"
  >
    <ul class="documenti">
      @for (documento of documenti(); track documento.nome) {
        <li>
          @if (daTogliere() === documento.nome) {
            <span class="nome">Togli «{{ documento.nome }}»?</span>
            <button
              type="button"
              class="si"
              (click)="togliDocumento.emit(documento.nome); daTogliere.set(null)"
            >
              Sì
            </button>
            <button type="button" class="no" (click)="daTogliere.set(null)">No</button>
          } @else {
            <span class="nome">{{ documento.nome }}</span>
            <span class="pagine">{{
              documento.pagine === 1 ? '1 pagina' : documento.pagine + ' pagine'
            }}</span>
            <button
              type="button"
              class="togli"
              [attr.aria-label]="'Togli ' + documento.nome"
              (click)="daTogliere.set(documento.nome)"
            >
              ×
            </button>
          }
        </li>
      }
    </ul>
    <div class="azioni">
      <label class="aggiungi">
        <input type="file" [accept]="formati" multiple (change)="scegli($event)" />
        Aggiungi altri
      </label>
      <button type="button" class="ricomincia" (click)="ricomincia.emit()">Ricomincia</button>
    </div>
  </div>
} @else {
  <label
    class="zona"
    [class.sopra]="sopra()"
    (dragover)="trascina($event)"
    (dragleave)="sopra.set(false)"
    (drop)="lascia($event)"
  >
    <input type="file" [accept]="formati" multiple (change)="scegli($event)" />
    <strong class="solo-mouse">Trascina qui il documento</strong>
    <span class="solo-mouse">o clicca per sceglierlo · JPG, PNG, HEIC, PDF, anche più file</span>
    <strong class="solo-tocco">Scegli il documento</strong>
    <span class="solo-tocco">Una foto o un PDF, anche più di uno</span>
  </label>
}
