<div class="campi">
  <label class="scopo">
    <span>Per cosa ti serve la copia?</span>
    <input
      [value]="scopo()"
      (input)="scopo.set(valore($event))"
      placeholder="affitto via Roma 10"
      autocomplete="off"
    />
  </label>
  <label>
    <span>Data</span>
    <input type="date" [value]="data()" (input)="data.set(valore($event))" />
  </label>
</div>
<label class="visibilita">
  <span>Visibilità della filigrana: {{ visibilita() * 100 | number: '1.0-0' }}%</span>
  <input
    type="range"
    min="0.15"
    max="0.7"
    step="0.01"
    [value]="visibilita()"
    (input)="visibilita.set(+valore($event))"
  />
</label>
<p class="sulla-copia">
  Sulla copia: <strong>{{ testo() }}</strong>
</p>
