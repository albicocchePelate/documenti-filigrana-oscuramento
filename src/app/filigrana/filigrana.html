<div class="campi">
  <label class="scritta">
    <span>Scritta sulla copia</span>
    <input
      [value]="scritta()"
      (input)="scritta.set(valore($event))"
      placeholder="Solo per affitto via Roma 10"
      autocomplete="off"
    />
  </label>
  <div class="campo-data">
    <span>Data</span>
    <app-calendario [(data)]="data" />
  </div>
</div>
<!-- Sul telefono l'aspetto si apre a richiesta: quello di partenza va bene quasi sempre -->
<button
  type="button"
  class="aspetto"
  aria-controls="stile-filigrana"
  [attr.aria-expanded]="aspetto()"
  (click)="aspetto.set(!aspetto())"
>
  Aspetto della filigrana
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" /></svg>
</button>
<div id="stile-filigrana" class="stile" [class.chiuso]="!aspetto()">
  <label class="visibilita">
    <span class="nome">Visibilità</span>
    <input
      type="range"
      min="0.25"
      max="0.7"
      step="0.01"
      [value]="stile().visibilita"
      (input)="cambia('visibilita', +valore($event))"
    />
    <span class="percentuale">{{ stile().visibilita * 100 | number: '1.0-0' }}%</span>
  </label>
  <app-scelta
    nome="Dimensione"
    [opzioni]="dimensioni"
    [valore]="stile().dimensione"
    (valoreChange)="cambia('dimensione', $event)"
  />
  <app-scelta
    nome="Colore"
    [opzioni]="colori"
    [valore]="stile().colore"
    (valoreChange)="cambia('colore', $event)"
  />
  <app-scelta
    nome="Fittezza"
    [opzioni]="fittezze"
    [valore]="stile().fittezza"
    (valoreChange)="cambia('fittezza', $event)"
  />
</div>
<p class="sulla-copia">
  Sulla copia: <strong>{{ testo() }}</strong>
</p>
