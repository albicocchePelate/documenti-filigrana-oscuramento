<div class="pulsanti">
  <button type="button" class="pdf" [disabled]="!pronto() || preparo()" (click)="pdf()">
    {{ preparo() ? 'Preparo…' : 'Scarica PDF' }}
  </button>
  <button type="button" class="immagini" [disabled]="!pronto() || preparo()" (click)="immagini()">
    Scarica immagini
  </button>
</div>
@if (!pronto()) {
  <p class="nota">Scrivi prima per cosa ti serve la copia.</p>
} @else {
  <p class="nota">
    La copia non contiene metadati: niente posizione, telefono o data dello scatto.
  </p>
}
