<div class="scelte">
  <app-scelta nome="Formato" [opzioni]="formati" [(valore)]="formato" />
  @if (documenti().length > 1) {
    <app-scelta nome="Documenti" [opzioni]="raggruppamenti" [(valore)]="insieme" />
  }
  <label class="aggiunta">
    <span class="nome-campo">Aggiunta al nome</span>
    <input
      [value]="aggiunta()"
      (input)="aggiunta.set(valore($event))"
      placeholder="nessuna"
      autocomplete="off"
    />
  </label>
</div>

<ul class="uscite">
  @for (uscita of uscite(); track uscita.etichetta) {
    <li>
      <span class="file">
        <span class="nome-file">
          <input
            [value]="nome(uscita)"
            (input)="rinomina(uscita, valore($event))"
            [attr.aria-label]="'Nome del file per ' + uscita.etichetta"
            autocomplete="off"
          />
          <span class="coda">{{ coda(uscita) }}</span>
        </span>
        <span class="contenuto">{{ contenuto(uscita) }}</span>
      </span>
      <button type="button" [disabled]="!pronto() || preparo()" (click)="scarica(uscita)">
        {{ preparo() === uscita.etichetta ? 'Preparo…' : 'Scarica' }}
      </button>
    </li>
  }
</ul>

@if (!pronto()) {
  <p class="nota">Completa prima la scritta sulla copia.</p>
}
