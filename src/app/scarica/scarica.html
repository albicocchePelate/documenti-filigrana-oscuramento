<div class="scelte">
  <div class="scelta" role="radiogroup" aria-label="Formato">
    <span class="nome-scelta">Formato</span>
    <button
      type="button"
      role="radio"
      [attr.aria-checked]="formato() === 'pdf'"
      (click)="formato.set('pdf')"
    >
      PDF
    </button>
    <button
      type="button"
      role="radio"
      [attr.aria-checked]="formato() === 'jpg'"
      (click)="formato.set('jpg')"
    >
      Immagini JPG
    </button>
  </div>

  @if (documenti().length > 1) {
    <div class="scelta" role="radiogroup" aria-label="Documenti">
      <span class="nome-scelta">Documenti</span>
      <button
        type="button"
        role="radio"
        [attr.aria-checked]="!insieme()"
        (click)="insieme.set(false)"
      >
        Separati
      </button>
      <button
        type="button"
        role="radio"
        [attr.aria-checked]="insieme()"
        (click)="insieme.set(true)"
      >
        Tutti in un file
      </button>
    </div>
  }
</div>

<ul class="uscite">
  @for (uscita of uscite(); track uscita.etichetta) {
    <li>
      <span class="file">
        <strong>{{ uscita.etichetta }}</strong>
        <span>{{ contenuto(uscita) }}</span>
      </span>
      <button type="button" [disabled]="!pronto() || preparo()" (click)="scarica(uscita)">
        {{ preparo() === uscita.etichetta ? 'Preparo…' : 'Scarica' }}
      </button>
    </li>
  }
</ul>

@if (!pronto()) {
  <p class="nota">Completa prima la scritta sulla copia.</p>
}
