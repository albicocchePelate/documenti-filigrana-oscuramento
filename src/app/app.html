<app-carica (caricati)="aggiungi($event)" />

@if (lettura(); as testo) {
  <p class="lettura" aria-live="polite">
    <span class="rotella" aria-hidden="true"></span>{{ testo }}
  </p>
}
@for (errore of errori(); track errore) {
  <p class="errore" role="alert">{{ errore }}</p>
}

@if (pagine().length) {
  <app-filigrana [(scopo)]="scopo" [(data)]="data" [(visibilita)]="visibilita" [testo]="testo()" />
  <app-scarica [pagine]="pagine()" [filigrana]="filigrana()" [pronto]="pronto()" />
  <app-anteprima [pagine]="pagine()" [filigrana]="filigrana()" (togli)="togli($event)" />
}
